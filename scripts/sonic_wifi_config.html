<body>
  <div class="card">
    <h2>📶 Xiaozhi Sonic Network Configuration / Cấu hình mạng sóng âm Xiaozhi</h2>
    <label for="ssid">WiFi Name / Tên WiFi</label>
    <input id="ssid" type="text" value="" placeholder="Please enter WiFi name / Vui lòng nhập tên WiFi" />

    <label for="pwd">WiFi Password / Mật khẩu WiFi</label>
    <input id="pwd" type="password" value="" placeholder="Please enter WiFi password / Vui lòng nhập mật khẩu WiFi" />

    <div class="checkbox-container">
      <label><input type="checkbox" id="loopCheck" checked /> Automatically loop sonic wave / Tự động lặp lại sóng âm</label>
    </div>

    <div class="theme-toggle-button">
      <input type="checkbox" id="theme-checkbox" class="theme-checkbox">
      <label for="theme-checkbox" class="theme-label">
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </label>
    </div>

    <button onclick="generate()">🎵 Generate and Play Sonic Wave / Tạo và phát sóng âm</button>
    <button onclick="stopPlay()">⏹️ Stop Playing / Dừng phát</button>
    <audio id="player" controls></audio>
  </div>

  <script>
    const MARK = 1800;
    const SPACE = 1500;
    const SAMPLE_RATE = 44100;
    const BIT_RATE = 100;
    const START_BYTES = [0x01, 0x02];
    const END_BYTES = [0x03, 0x04];
    let loopTimer = null;

    function checksum(data) {
      return data.reduce((sum, b) => (sum + b) & 0xff, 0);
    }

    function toBits(byte) {
      const bits = [];
      for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
      return bits;
    }

    function afskModulate(bits) {
      const samplesPerBit = SAMPLE_RATE / BIT_RATE;
      const totalSamples = Math.floor(bits.length * samplesPerBit);
      const buffer = new Float32Array(totalSamples);
      for (let i = 0; i < bits.length; i++) {
        const freq = bits[i] ? MARK : SPACE;
        for (let j = 0; j < samplesPerBit; j++) {
          const t = (i * samplesPerBit + j) / SAMPLE_RATE;
          buffer[i * samplesPerBit + j] = Math.sin(2 * Math.PI * freq * t);
        }
      }
      return buffer;
    }

    function floatTo16BitPCM(floatSamples) {
      const buffer = new Uint8Array(floatSamples.length * 2);
      for (let i = 0; i < floatSamples.length; i++) {
        const s = Math.max(-1, Math.min(1, floatSamples[i]));
        const val = s < 0 ? s * 0x8000 : s * 0x7fff;
        buffer[i * 2] = val & 0xff;
        buffer[i * 2 + 1] = (val >> 8) & 0xff;
      }
      return buffer;
    }

    function buildWav(pcm) {
      const wavHeader = new Uint8Array(44);
      const dataLen = pcm.length;
      const fileLen = 36 + dataLen;

      const writeStr = (offset, str) => {
        for (let i = 0; i < str.length; i++) wavHeader[offset + i] = str.charCodeAt(i);
      };
      const write32 = (offset, value) => {
        wavHeader[offset] = value & 0xff;
        wavHeader[offset + 1] = (value >> 8) & 0xff;
        wavHeader[offset + 2] = (value >> 16) & 0xff;
        wavHeader[offset + 3] = (value >> 24) & 0xff;
      };
      const write16 = (offset, value) => {
        wavHeader[offset] = value & 0xff;
        wavHeader[offset + 1] = (value >> 8) & 0xff;
      };

      writeStr(0, 'RIFF');
      write32(4, fileLen);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      write32(16, 16);
      write16(20, 1);
      write16(22, 1);
      write32(24, SAMPLE_RATE);
      write32(28, SAMPLE_RATE * 2);
      write16(32, 2);
      write16(34, 16);
      writeStr(36, 'data');
      write32(40, dataLen);

      return new Blob([wavHeader, pcm], { type: 'audio/wav' });
    }

    function generate() {
      stopPlay();
      const ssid = document.getElementById('ssid').value.trim();
      const pwd = document.getElementById('pwd').value.trim();
      const dataStr = ssid + '\n' + pwd;
      const textBytes = Array.from(new TextEncoder().encode(dataStr));
      const fullBytes = [...START_BYTES, ...textBytes, checksum(textBytes), ...END_BYTES];

      let bits = [];
      fullBytes.forEach((b) => (bits = bits.concat(toBits(b))));

      const floatBuf = afskModulate(bits);
      const pcmBuf = floatTo16BitPCM(floatBuf);
      const wavBlob = buildWav(pcmBuf);

      const audio = document.getElementById('player');
      audio.src = URL.createObjectURL(wavBlob);
      audio.load();
      audio.play();

      // Modified here: use 'ended' event to achieve loop playback
      // Đã sửa đổi ở đây: sử dụng sự kiện 'ended' để thực hiện phát lại vòng lặp
      if (document.getElementById('loopCheck').checked) {
        audio.onended = function() {
          audio.currentTime = 0;  // Start from the beginning / Bắt đầu từ đầu
          audio.play();           // Play again / Phát lại
        };
      }
    }

    function stopPlay() {
      const audio = document.getElementById('player');
      audio.pause();
      audio.onended = null;  // Clear event listener / Xóa trình nghe sự kiện
    }

    // Theme switch logic
    const toggleSwitch = document.getElementById('theme-checkbox');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.body.classList.add(currentTheme);
      if (currentTheme === 'dark-mode') {
        toggleSwitch.checked = true;
      }
    }

    function switchTheme(e) {
      if (e.target.checked) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark-mode');
      } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light-mode');
      }
    }

    toggleSwitch.addEventListener('change', switchTheme, false);
  </script>
